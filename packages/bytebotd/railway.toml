[build]
builder = "DOCKERFILE"
dockerfilePath = "packages/bytebotd/Dockerfile"

[deploy]
# Bytebotd uses supervisord to manage multiple processes (X11, VNC, noVNC, desktop)
# The CMD in the Dockerfile starts supervisord
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Desktop environment requires more resources
# Recommended: 2GB RAM, 2 vCPU
# Railway will use defaults if not specified in the UI

# Health check on the bytebotd HTTP endpoint
[deploy.healthcheck]
path = "/"
timeout = 300
interval = 60

[deploy.environmentVariables]
# X11 Display configuration (required for desktop environment)
DISPLAY = ":0"

# Port configuration (defaults to 9990 if not set)
# This port serves both the bytebotd API and noVNC websocket endpoint
# PORT = "9990"

# Note: This service requires significant resources due to the full desktop environment
# including XFCE, Firefox, VS Code, and VNC server
# Recommended Railway plan: Pro or higher for optimal performance
